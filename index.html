<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>온더훅</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
/* Layout concept: a single phone-sized messenger frame centered on a dark stage; three app themes (mint / pink / dark) swap through tokens on .app. */
:root{
  --stage:#0e1213;
  --stage-fg:#e8eeee;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--stage);color:var(--stage-fg);font-family:var(--font);
  display:flex;align-items:center;justify-content:center;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg{display:block}
svg,symbol{overflow:visible}

/* ---------- themes ---------- */
.app{
  --hdr:#72c7c5; --main:#72c7c5; --section:#72c7c5; --avatar:#4ac8c4;
  --bg:#fff; --text:#161616; --sub:#a9a9a9; --line:#eeeeee;
  --tabbg:#f8f8f8; --tabicon:#c9c9c9;
  --bubble-them:#ebebeb; --card:#fff; --btn-line:#e4e4e4; --btn-active:#dedede;
  --dot:#c8c8c8; --dot-sel:#72c7c5; --tabline:#72c7c5; --badge:#e8322b; --field:#ddd;
}
.app[data-theme="pink"]{--hdr:#e39696;--main:#e39696;--section:#e39696;--avatar:#e39696;--dot-sel:#e39696;--tabline:#efbcbc}
.app[data-theme="dark"]{
  --hdr:#666;--main:#d2d2d2;--section:#bdbdbd;--avatar:#7d7d7d;
  --bg:#1a1a1a;--text:#fff;--sub:#8e8e8e;--line:#2b2b2b;
  --tabbg:#242424;--tabicon:#5b5b5b;--bubble-them:#343434;--card:#262626;
  --btn-line:#3a3a3a;--btn-active:#3a3a3a;--dot:#c6c6c6;--dot-sel:#666;--tabline:#d2d2d2;--field:#444;
}

.app{
  position:relative;width:min(100%,420px);height:100%;max-height:860px;overflow:hidden;
  display:flex;flex-direction:column;border-radius:26px;
  background:var(--bg);color:var(--text);
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  font-size:16px;
}

/* ---------- header / tabs ---------- */
.hdr{flex:none;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 20px;background:var(--hdr);color:#fff}
.ttl{font-size:19px;font-weight:500;letter-spacing:.01em}
.ttl .n{color:#f8ff5a;font-size:19px;margin-left:8px;font-weight:400;font-variant-numeric:tabular-nums}
.hicons{display:flex;gap:20px;align-items:center}
.hicons button{width:34px;height:34px;display:grid;place-items:center;color:#fff}
.hicons svg{width:24px;height:auto;max-height:28px}
.hicons .ico{width:34px;height:34px;display:grid;place-items:center;color:#fff;pointer-events:none}
.hicons .ico svg{width:21px;height:30px;max-height:none}

.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--tabbg)}
.tab{position:relative;height:80px;display:grid;place-items:center;color:var(--tabicon);border-bottom:4px solid transparent}
.tab[aria-selected="true"]{color:var(--main);border-bottom-color:var(--tabline)}
.tab svg{height:auto}
.tab svg[width="16"]{height:28px}
.badge{position:absolute;top:46px;left:calc(50% + 14px);min-width:24px;height:24px;border-radius:12px;padding:0 6px;background:var(--badge);color:#fff;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge[hidden]{display:none}

.view{position:relative;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:0 18px 28px}
.sec{font-size:14px;font-weight:700;color:var(--section);padding:18px 2px 9px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:18px;width:100%;min-width:0;padding:13px 2px;text-align:left;border-bottom:1px solid var(--line)}
.row .txt{min-width:0;flex:1}
.row .sbub{position:relative;flex:none;max-width:46%;min-width:48px;margin-right:10px;padding:10px 12px;border-radius:20px;background:#f6f6f6;color:#111;font-size:12px;line-height:1.3;text-align:center;word-break:break-all}
.row .sbub:after{content:'';position:absolute;left:-8px;bottom:0;width:24px;height:12px;background:#f6f6f6;clip-path:polygon(0 100%,50% 0,100% 0,100% 100%)}
.row .name{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .last{font-size:16px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:70px 10px;text-align:center;color:var(--sub);font-size:16px}
.addbtn{flex:none;width:62px;height:48px;border:3px solid var(--btn-line);border-radius:10px;display:grid;place-items:center;color:#b3b3b3}
.addbtn:hover{color:var(--main);border-color:var(--main)}
.addbtn svg{width:30px;height:auto}
.ntitle{text-align:center;color:var(--section);font-size:22px;letter-spacing:.12em;padding:16px 0 12px}
.nlines{display:grid;gap:5px;margin-bottom:16px}
.nlines i{display:block;height:6px;background:var(--tabbg)}
.nrow{display:flex;align-items:center;gap:14px;min-height:46px;margin-bottom:6px;padding:7px 12px;border-radius:14px;background:var(--tabbg);color:var(--tabicon);font-size:14.5px}
.nrow span{color:var(--text);min-width:0}
.nrow.new{color:var(--main)}
.nrow svg{flex:none}

.avatar{width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--avatar);display:grid;place-items:center;overflow:hidden}
.avatar .fish{width:54%;height:auto;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.mine{background:linear-gradient(160deg,#d9eceb,#a9d3d3)}
.avatar.mine .person{width:62%;height:auto;color:#fff}

/* ---------- settings menu ---------- */
.scrim{position:absolute;inset:0;z-index:14}
.menu{position:absolute;z-index:15;top:16px;right:10px;width:min(64%,270px);background:var(--card);box-shadow:3px 4px 3px rgba(0,0,0,.55);padding-bottom:4px}
.menu-h{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px 2px 14px;height:52px;color:var(--section)}
.menu-h b{font-size:13px;font-weight:700;margin-top:2px}
.menu-h svg{width:30px;height:30px;color:var(--main)}
.hicons.hnew{position:relative;display:block;width:77px;height:33px;flex:none}
.hicons.hnew .hi{display:block;pointer-events:none;user-select:none}
.hicons.hnew .gearhit{position:absolute;left:56%;right:-6px;top:-12px;bottom:-12px;width:auto;height:auto;background:none}

.menu-h button{display:block;color:var(--main)}
.mi.off{pointer-events:none;cursor:default}
.mi{display:flex;align-items:center;gap:16px;width:100%;height:40px;padding:0 12px 0 16px;text-align:left}
.mi .ic{width:24px;height:24px;color:var(--main);flex:none}
.mi .lb{flex:1;font-size:13px}
.mi .ctl{flex:none}
.tg{width:34px;height:auto;color:#b5b5b5}
.tg.on{color:var(--main)}
.dots{display:flex;gap:3px}
.dots i{width:17px;height:17px;border-radius:50%;background:var(--dot)}
.dots i.sel{background:var(--dot-sel)}

/* ---------- dialogs ---------- */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.46);display:grid;place-items:center;padding:20px}
.overlay[hidden]{display:none}
.endline{height:4px;margin:14px 6px 4px;background:#efefef}
.endline.mid{margin:14px 6px}
.app[data-theme="dark"] .endline{background:#333}
.viewer{position:absolute;inset:0;z-index:38;background:#000;display:flex;align-items:center;justify-content:center}
.viewer[hidden]{display:none}
.viewer img{display:block;max-width:100%;max-height:100%;width:100%;height:auto;object-fit:contain}
.viewer .dl{position:absolute;top:14px;right:16px;width:44px;height:44px;display:grid;place-items:center;color:#fff}
.viewer .dl svg{width:30px;height:30px}
.dlg{width:min(100%,292px);background:var(--card);color:var(--text);border-radius:30px;padding:22px 18px 20px;position:relative}
.dlg h3{margin:4px 0 0;text-align:center;font-weight:400;font-size:17px}
.prompt{width:min(100%,330px);padding:24px 22px 22px}
.prompt .in{display:block;width:62%;margin:36px auto 18px;height:40px;border-radius:8px;border:0;background:#000;color:#fff;font:inherit;font-size:18px;padding:0 12px;caret-color:#3d6bff}
.prompt .in::placeholder{color:#777}
.prompt .in:focus,.prompt .in:focus-visible{outline:0}
.app[data-theme="dark"] .prompt .in{background:#555;color:#fff}
.btns{display:flex;justify-content:center;gap:26px}
.btn{min-width:84px;height:48px;border:2px solid var(--btn-line);border-radius:7px;font-size:19px;color:var(--text);opacity:.85}
.btn:hover{border-color:var(--main)}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;display:grid;place-items:center;color:#777}
.x svg{width:22px;height:22px}
.prof{padding-top:46px}
.prof .pav{display:grid;place-items:center}
.pname{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:16px;font-size:17px;font-weight:500}
.pname button{color:#d6d6d6;width:26px;height:26px}
.pname button:hover{color:var(--main)}
.pname svg{width:16px;height:16px}
.pinfo{min-height:70px;display:grid;place-items:center;text-align:center;color:var(--sub);font-size:14px;line-height:1.55;padding:6px 4px}
.pstatus{display:inline-flex;align-items:center;gap:4px;font-size:14px}
.pstatus button{width:22px;height:22px;color:#d6d6d6}
.pstatus button:hover{color:var(--main)}
.pstatus svg{width:16px;height:16px}
.pbtn.dis{background:var(--btn-active);border-color:#cfcfcf;pointer-events:none}
.pbtn.dis svg{opacity:.45}
.pbtn.cur{background:#dcdcdc;border-color:#c9c9c9;color:#b3b3b3;pointer-events:none}
.prof hr{border:0;border-top:1px solid var(--btn-line);margin:0 0 16px}
.pbtns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.pbtn{height:52px;border:1px solid var(--btn-line);border-radius:4px;display:grid;place-items:center;color:var(--main)}
.pbtn:hover{border-color:var(--main)}
.pbtn svg{width:30px;height:30px}
.sheet h3{font-weight:700;font-size:18px;margin-bottom:16px}
.ach{list-style:none;margin:0;padding:0}
.ach li{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line);font-size:16px}
.ach li:last-child{border-bottom:0}
.ach .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--btn-line);display:grid;place-items:center;flex:none;color:#fff}
.ach li.done .ck{background:var(--main);border-color:var(--main)}
.ach li.done .ck svg{display:block}
.ach .ck svg{display:none;width:14px;height:14px}
.ach small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.album .ph{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bubble-them);border:2px solid transparent;display:grid;place-items:center;color:var(--sub);font-size:30px}
.album .ph img{width:100%;height:100%;object-fit:cover}
.album .ph.cur{border-color:var(--main)}
.album .add:hover{color:var(--main)}
.hint{margin:14px 0 0;color:var(--sub);font-size:13px;text-align:center}
/* album page */
.apage{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;--emp:#dcdcdc}
.apage[hidden]{display:none}
.app[data-theme="dark"] .apage{--emp:#383838}
.apage .ttl{font-weight:700}
.apage .ttl .n{font-weight:300;margin-left:10px}
.apage .ax{width:36px;height:36px;display:grid;place-items:center;color:#fff;margin-right:2px}
.apage .ax svg{width:24px;height:24px}
.abody{position:relative;flex:1;min-height:0;overflow-y:auto}
.aempty{position:absolute;left:0;right:0;top:29%;display:flex;flex-direction:column;align-items:center}
.aempty img{width:146px;height:auto;display:block}
.agrid{padding:14px 18px}
/* save dialog */
.savedlg{width:min(100%,328px);padding:39px 19px 27px;border-radius:30px;--sv:#4cc9c2;--ld:#9fdcd8;--tint:#a9e6e2;--note:#333;--xc:#666}
.app[data-theme="pink"] .savedlg{--sv:#ee8f8f;--ld:#efc1c1;--tint:#f9d0d2}
.app[data-theme="dark"] .savedlg{--sv:#5f5f5f;--ld:#a6a6a6;--tint:#bdbdbd;--note:#7c7c7c;--xc:#8a8a8a}
.savedlg .x{top:30px;right:19px;width:30px;height:30px;color:var(--xc)}
.savedlg .x svg{width:30px;height:30px}
.savedlg h3{text-align:left;font-size:24px;font-weight:700;line-height:30px;margin:0;letter-spacing:-.01em}
.savedlg .sn{margin:18px 0 21px;font-size:10.5px;line-height:14.5px;font-weight:400;color:var(--note);letter-spacing:-.04em}
.sfile{position:relative;height:63px;margin-bottom:7px;background:#ededed}
.sfile:last-child{margin-bottom:0}
.sfn{position:absolute;left:0;top:0;width:59px;height:auto;display:block}
.sbtns{position:absolute;right:12px;bottom:7px;display:flex;gap:5px}
.sb{width:45px;height:28px;border-radius:5px;color:#fff;font-size:10.5px;font-weight:500;letter-spacing:-.04em;white-space:nowrap}
.sb.sv{background:var(--sv)}
.sb.ld{background:var(--ld)}
.sb:active{filter:brightness(.92)}
.sb.ld.has{background:var(--sv)}
.sfile.on{background:var(--tint)}
.sdt{position:absolute;right:12px;top:14px;font-size:11px;line-height:13px;color:#222;letter-spacing:-.02em}
.overlay.dim2 .savedlg{filter:brightness(.62)}

/* ---------- chat ---------- */
.chat{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;background:var(--bg)}
.chat[hidden]{display:none}
.chat .hdr{justify-content:flex-start;gap:14px;padding-left:12px}
.back{width:40px;height:40px;display:grid;place-items:center}
.back svg{width:26px;height:26px}
.msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 14px 12px;display:flex;flex-direction:column}
#list{display:flex;flex-direction:column;gap:9px}
#inline .compose{padding:12px 0 0}
.choices{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:64px;padding-bottom:28px}
.choices:empty{display:none}
.choice{background:var(--hdr);color:#fff;border-radius:7px;padding:22px 26px;font-size:17px;line-height:1.2}
.choice:active{filter:brightness(.92)}
.chat.blur .msgs,.chat.blur .compose{filter:blur(6px)}
.compose .send{transition:transform .18s ease,filter .18s ease}
.compose .send.press{filter:brightness(.82);transform:scale(.94)}
.rbadge{flex:none;min-width:24px;height:24px;border-radius:12px;padding:0 6px;background:var(--badge);color:#fff;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.alertcard{position:absolute;z-index:42;left:16px;right:16px;top:96px;padding:16px 18px;border-radius:14px;background:var(--hdr);color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.35);transition:opacity .35s}
.alertcard[hidden]{display:block;opacity:0;pointer-events:none}
.favcard{position:absolute;z-index:42;left:14px;right:14px;top:92px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:rgba(100,206,202,.9);color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.12);transition:opacity .45s;pointer-events:none}
.favcard[hidden]{display:none}
.favcard.out{opacity:0}
.app[data-theme="pink"] ~ .favcard,.app[data-theme="pink"] .favcard{background:rgba(232,158,158,.93)}
.app[data-theme="dark"] .favcard{background:rgba(110,110,110,.95)}
.favcard .fi{flex:none;width:58px;height:58px}
.favcard .fi img{display:block;width:100%;height:100%}
.favcard .fi .fish{width:60%;height:auto;color:#fff}
.favcard .fi .mk{position:absolute;right:3px;bottom:3px;width:20px;height:8px;color:#fff;opacity:.9}
.favcard b{display:block;font-size:21px;line-height:1.1;margin-bottom:3px}
.favcard span{display:block;font-size:14px;line-height:1.35}
.fgauge{position:relative;display:block;margin:17px auto;width:150px;height:59px}
.fgauge svg{position:absolute;inset:0;width:100%;height:100%}
.alertcard b{display:block;color:#fff;font-size:14px;margin-bottom:6px}
.alertcard span{font-size:16px}
.quit{width:min(100%,330px);border-radius:3px;padding:34px 18px 20px;text-align:center;box-shadow:3px 4px 4px rgba(0,0,0,.45)}
.quit h3{font-weight:700;font-size:19px;margin:0 0 30px}
.quit p{margin:0 0 26px;font-size:14px;line-height:1.55}
.quit .qb{display:flex;gap:14px;justify-content:center}
.quit .qb button{flex:1;max-width:136px;height:52px;border-radius:4px;font-size:21px;color:#fff}
.quit .qb .q-ok{background:#8c8c8c}
.quit .qb .q-no{background:var(--hdr)}
.pstack{display:grid;width:min(100%,292px)}
.pstack>.dlg{grid-area:1/1;width:100%}
.pcard{transition:transform .34s cubic-bezier(.3,.75,.3,1)}
.overlay{overflow:hidden;animation:ovin .18s ease-out}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.row:active{background:rgba(114,199,197,.38)}
.app[data-theme="pink"] .row:active{background:rgba(227,150,150,.38)}
.app[data-theme="dark"] .row:active{background:rgba(255,255,255,.12)}
.empty2{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.empty2 img{display:block;max-width:none}
.pfish{display:block;margin:17px auto}
.stranger{font-size:14px;color:var(--text)}
.info .pbtns{height:52px;place-items:center}
.cfm{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:min(86%,340px);background:var(--card);color:var(--text);border-radius:12px;padding:20px 20px 16px;box-shadow:3px 4px 4px rgba(0,0,0,.45);z-index:2}
.cfm.sm{width:67%;aspect-ratio:283/169;display:flex;flex-direction:column;padding:16px 18px 14px}
.cfm.sm b{margin-bottom:12px}
.cfm.sm .yn{margin-top:auto;padding-right:14px}
.cfm b{display:block;font-size:19px;margin-bottom:22px}
.cfm p{margin:0 0 18px;font-size:15px;line-height:1.5}
.cfm .yn{display:flex;justify-content:flex-end;gap:22px}
.cfm .yn button{font-size:17px;font-weight:700;padding:6px 4px;letter-spacing:.02em}
.overlay.dim2{background:rgba(0,0,0,.6)}
.psel{width:min(100%,260px);padding:22px 18px 18px}
.psel h3{font-weight:700;font-size:19px;margin:0 0 18px}
.popts{display:flex;justify-content:space-around}
.popts button{display:grid;justify-items:center;gap:6px;font-size:11px}
.popts .gal{width:50px;height:50px;border-radius:12px;background:#c3c3c3;display:grid;place-items:center}
.m{display:flex;max-width:100%}
.m.pop{animation:mpop .24s cubic-bezier(.2,.8,.3,1)}
.m.me.pop{transform-origin:100% 100%}
.m.them.pop{transform-origin:0 100%}
@keyframes mpop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.m.me{justify-content:flex-end}
.bub{position:relative;max-width:72%;padding:9px 14px;border-radius:9px;font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.me .bub{background:var(--hdr);color:#fff;margin-right:8px}
.me .bub::after{content:"";position:absolute;right:-6px;top:7px;border:6px solid transparent;border-left-color:var(--hdr);border-right:0}
.them{gap:10px;align-items:flex-start}
.them .gap{width:44px;flex:none}
.them .avbtn{flex:none;border-radius:50%}
.them .col{min-width:0;display:flex;flex-direction:column;gap:5px;max-width:78%}
.them .nm{font-size:13px;color:var(--text);opacity:.85}
.them .bub{background:var(--bubble-them);color:var(--text);margin-left:8px;align-self:flex-start;max-width:100%}
.them .bub.first::after{content:"";position:absolute;left:-6px;top:7px;border:6px solid transparent;border-right-color:var(--bubble-them);border-left:0}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.compose{flex:none;display:flex;gap:9px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.compose input{flex:1;min-width:0;height:44px;font-size:17px;border:2px solid var(--field);border-radius:5px;background:transparent;color:var(--text);font:inherit;padding:0 12px}
.compose .send{width:56px;height:44px;border-radius:6px;background:var(--hdr);display:grid;place-items:center}
.compose .send img{display:block;max-width:none}

.toast{position:absolute;z-index:40;left:50%;bottom:84px;transform:translateX(-50%);width:max-content;max-width:94%;white-space:nowrap;padding:11px 20px;border-radius:22px;background:rgba(102,102,102,.96);color:#fff;font-size:15px;text-align:center;transition:opacity .25s;pointer-events:none}
.toast[hidden]{display:block;opacity:0}
.bye{position:absolute;inset:0;z-index:50;background:#050505;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:30px}
.bye[hidden]{display:none}
.bye p{margin:0;font-size:18px;color:#cfcfcf;line-height:1.6}
.bye .btn{color:#fff;border-color:#555}

@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.7}.toast{transition:none}}
@media (max-width:440px){.app{border-radius:20px}.view{padding-inline:14px}}
html,body{height:100dvh}
html,body,.app,.app *{touch-action:manipulation}
body{-webkit-text-size-adjust:100%;overscroll-behavior:none}
@media (max-width:500px){
  body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  .app{width:100%;height:100%;max-height:none;border-radius:0}
}

  function emptyState(k){var e=EMPTY_IMG[k];return '<div class="empty2" style="top:'+(245-e.y/2)+'px"><img src="'+e.u+'" width="'+(e.w/2)+'" height="'+(e.h/2)+'" alt="'+e.t+'"></div>'}

  /* ---------- main render ---------- */
  function render(){
    $('#app').dataset.theme=THEMES[S.theme];
    var counts=[S.friends.length,S.rooms.length,S.recs.length,S.notes.length];
    $('#ttl').innerHTML=TITLES[U.tab]+'<span class="n">'+counts[U.tab]+'</span>';
    document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',String(+b.dataset.i===U.tab))});
    var b1=$('#b1'),b2=$('#b2'),b3=$('#b3'),unread=S.notes.filter(function(n){return!n.read}).length;
    var cu=0;Object.keys(S.unread||{}).forEach(function(k){cu+=S.unread[k]||0});
    b1.textContent=cu;b1.hidden=!cu;
    b2.textContent=S.recs.length;b2.hidden=!S.recs.length;
    b3.textContent=unread;b3.hidden=!unread;
    var h='';
    if(U.tab===0){
      h+='<div class="sec">내 프로필</div>'+
        '<button class="row" data-act="prof" data-id="me">'+av('me',54)+'<div class="txt"><div class="name">'+esc(S.me.name)+'</div></div>'+(S.me.status?'<div class="sbub">'+esc(S.me.status)+'</div>':'')+'</button>'+
        '<div class="sec">즐겨찾기('+S.friends.length+'/1)</div>';
      S.friends.forEach(function(f){h+='<button class="row" data-act="prof" data-id="'+f.id+'">'+av(f,54)+'<div class="txt"><div class="name">'+esc(f.name)+'</div></div></button>'});
      if(!S.friends.length)h+=emptyState('friend');
    }else if(U.tab===1){
      if(!S.rooms.length)h=emptyState('chat');
      S.rooms.forEach(function(id){
        var f=friend(id);if(!f)return;var c=S.chats[id]||[],last=(c.filter(function(x){return x.f!=='line'}).slice(-1)[0]||{t:''}).t;
        h+='<button class="row" data-act="chat" data-id="'+id+'">'+av(f,54)+'<div class="txt"><div class="name">'+esc(f.name)+'</div><div class="last">'+esc(last)+'</div></div>'+(S.unread[id]?'<span class="rbadge">'+S.unread[id]+'</span>':'')+'</button>';
      });
    }else if(U.tab===2){
      h=S.recs.length?'<div class="sec">추천친구</div>':emptyState('rec');
      S.recs.forEach(function(r){h+='<div class="row">'+av(r,54)+'<div class="txt"><div class="name">'+esc(r.name)+'</div></div><button class="addbtn" data-act="add" data-id="'+r.id+'" aria-label="'+esc(r.name)+' 친구 추가"><svg viewBox="0 0 1100 600"><use href="#i-fishplus"/></svg></button></div>'});
    }else{
      h='<div class="ntitle">알림</div><div class="nlines"><i></i><i></i></div>';
      if(!S.notes.length)h+=emptyState('note');
      S.notes.forEach(function(n){
        var fresh=!n.read||U.fresh.indexOf(n.id)>=0;
        h+='<div class="nrow'+(fresh?' new':'')+'"><svg viewBox="0 0 60 40" width="29" height="19"><use href="#i-mail"/></svg><span>'+esc(n.t)+'</span></div>';
      });
    }
    var vw=$('#view');vw.innerHTML=h;
    if(U.slide){var d=U.slide;U.slide=0;if(vw.animate)vw.animate([{transform:'translateX('+(d*100)+'%)',opacity:.55},{transform:'none',opacity:1}],{duration:270,easing:'cubic-bezier(.25,.8,.3,1)'})}
  }
  function goTab(i){
    if(i===U.tab){render();return}
    U.slide=i>U.tab?1:-1;U.tab=i;U.fresh=[];
    if(i===3){S.notes.forEach(function(n){if(!n.read)U.fresh.push(n.id);n.read=true});persist()}
    render();
  }

  function renderChat(){
    var id=U.chat;if(!id)return;var f=friend(id);if(!f)return;
    $('#chatName').textContent=f.name;
    var c=S.chats[id]||[],h='',prev=null;
    var popI=(U.pop&&U.pop.id===id)?U.pop.i:-1,smooth=popI>=0||U.typing===id;U.pop=null;
    c.forEach(function(m,mi){
      var pc=(mi===popI&&m.f==='me')?' pop':'';
      if(m.f==='line'){h+='<div class="endline mid"></div>';prev='line';return}
      if(m.f==='me'){h+='<div class="m me'+pc+'"><div class="bub">'+esc(m.t)+'</div></div>'}

  var SEQ={

    ],

  var TYPE_MS=65;

  /* Hangul jamo composition: ㄴ -> 누 -> 눅 -> 누구 */
  var CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
  var C2J={0:1,1:2,2:4,3:7,5:8,6:16,7:17,9:19,10:20,11:21,12:22,14:23,15:24,16:25,17:26,18:27};
  var VSPLIT={9:[8,0],10:[8,1],11:[8,20],14:[13,4],15:[13,5],16:[13,20],19:[18,20]};
  var FSPLIT={3:[1,19],5:[4,22],6:[4,27],9:[8,1],10:[8,16],11:[8,17],12:[8,19],13:[8,25],14:[8,26],15:[8,27],18:[17,19]};
  function compose(c,j,f){return String.fromCharCode(0xAC00+(c*21+j)*28+f)}
  function decomp(ch){var n=ch.charCodeAt(0)-0xAC00;if(n<0||n>11171)return null;return{c:Math.floor(n/588),j:Math.floor((n%588)/28),f:n%28}}
  function jamoSteps(text){
    var out=[],head='',prev=null;
    Array.from(text).forEach(function(ch){
      var d=decomp(ch);
      if(!d){if(prev){head+=prev.s;prev=null}head+=ch;out.push(head);return}
      var pre=head+(prev?prev.s:''),fj=C2J[d.c];
      if(prev&&prev.f===0&&fj)out.push(head+compose(prev.c,prev.j,fj));
      else out.push(pre+CHO[d.c]);
      var vs=VSPLIT[d.j];if(vs)out.push(pre+compose(d.c,vs[0],0));
      out.push(pre+compose(d.c,d.j,0));
      if(d.f){var fs=FSPLIT[d.f];if(fs)out.push(pre+compose(d.c,d.j,fs[0]));out.push(pre+compose(d.c,d.j,d.f))}
      if(prev)head+=prev.s;
      prev={c:d.c,j:d.j,f:d.f,s:compose(d.c,d.j,d.f)};
    });
    return out;
  }

  function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
  function until(fn,tok,id){return new Promise(function(res){(function t(){if(RUN[id]!==tok||fn())res();else setTimeout(t,150)})()})}
  function npcDelay(t){return t.length<=3?1000:Math.min(2100,1000+(t.length-3)*180)}

  function pushMsg(id,from,t){
    var f=friend(id);if(!f)return;
    (S.chats[id]=S.chats[id]||[]).push({f:from,t:t});U.pop={id:id,i:S.chats[id].length-1};
    if(S.rooms.indexOf(id)<0)S.rooms.unshift(id);
    if(from==='them'&&U.chat!==id){S.unread[id]=(S.unread[id]||0)+1;if(S.notif)toast(f.name+': '+t)}
    if(from==='me')S.st.talked=true;
    persist();
    if(U.chat===id)renderChat();else render();
  }

  async function typeLine(id,text,tok){
    var inp=$('#msg'),steps=jamoSteps(text);
    inp.value='';
    for(var k=0;k<steps.length;k++){
      if(U.chat!==id||RUN[id]!==tok){inp.value='';return false}
      inp.value=steps[k];inp.scrollLeft=inp.scrollWidth;
      await sleep(TYPE_MS);
    }
    return U.chat===id&&RUN[id]===tok;
  }

  async function step(id,st,tok,pg){
    var alive=function(){return RUN[id]===tok&&!!friend(id)};
    var open=function(){return U.chat===id};
    if(st.k==='pause'){
      if(!pg.due){pg.due=Date.now()+st.ms;persist()}
      await sleep(Math.max(0,pg.due-Date.now()));
      if(!alive())return false;
      pg.due=0;pg.i++;pg.j=0;persist();return true;
    }
    if(st.k==='them'){
      for(var j=pg.j||0;j<st.l.length;j++){
        var firstReply=SEQ[pg.s].filter(function(x){return x.k==='them'})[0]===st;
        await sleep(firstReply?(j===0?0:450):(j===0?800:150));if(!alive())return false;
        U.typing=id;if(U.chat===id)renderChat();
        await sleep(npcDelay(st.l[j]));
        U.typing=null;
        if(!alive())return false;
        pg.j=j+1;pushMsg(id,'them',st.l[j]);
      }
      pg.i++;pg.j=0;persist();return true;
    }
    if(st.k==='me'){
      var n=pg.j||0;
      while(n<st.l.length){
        await until(open,tok,id);if(!alive())return false;
        await sleep(n===0?800:500);if(!alive())return false;
        if(!open())continue;
        var ok=await typeLine(id,st.l[n],tok);
        if(!alive())return false;
        if(!ok)continue;
        await sleep(500);if(!alive())return false;
        if(!open()){$('#msg').value='';continue}
        var sb=$('#sendbtn');sb.classList.add('press');setTimeout(function(){sb.classList.remove('press')},260);
        await sleep(110);if(!alive())return false;
        $('#msg').value='';
        pushMsg(id,'me',st.l[n]);n++;pg.j=n;persist();
      }
      pg.i++;pg.j=0;persist();return true;
    }
    if(st.k==='ask'){
      await until(open,tok,id);if(!alive())return false;
      var idx=await new Promise(function(res){U.ask={id:id,o:st.o,res:res};renderChat()});
      if(!alive())return false;
      pg.s=st.o[idx][1];pg.i=0;pg.j=0;persist();return true;
    }
    if(st.k==='notify'){
      if(!alive())return false;
      S.fav=S.fav||{};S.fav[id]=1;pg.i++;pg.j=0;S.notes.unshift({id:Date.now(),t:'빈나리님은 '+S.me.name+'님을 [67번째 하인]으로 보고 있습니다.',read:false});persist();if(!U.chat)render();favAlert(id);return true;
    }
    if(st.k==='line'){
      if(!alive())return false;
      pushMsg(id,'line','');pg.i++;pg.j=0;persist();return true;
    }
    if(st.k==='block'){await blockNow(id);return false}
    return false;
  }

  async function run(id){
    if(RUN[id]||!friend(id))return;
    var tok=RUN[id]={};
    var pg=S.pg[id]||(S.pg[id]={s:'start',i:0,j:0});
    while(RUN[id]===tok&&friend(id)){
      var seq=SEQ[pg.s];
      if(!seq||pg.i>=seq.length)break;
      var okStep=await step(id,seq[pg.i],tok,pg);
      if(!okStep)return;
    }
    if(RUN[id]===tok){delete RUN[id];if(U.chat===id)renderChat()}
  }

  function blockNow(id){
    return new Promise(function(res){
      var f=friend(id);if(!f){res();return}
      var wasOpen=U.chat===id;
      function finish(){
        S.friends=S.friends.filter(function(x){return x.id!==id});
        S.recs.unshift({id:f.id,name:f.name});
        S.rooms=S.rooms.filter(function(x){return x!==id});
        delete S.chats[id];delete S.unread[id];delete S.pg[id];if(S.fav)delete S.fav[id];
        S.notes.unshift({id:Date.now(),t:f.name+'님의 방에서 나갔습니다.',read:false});
        delete RUN[id];U.ask=null;U.typing=null;persist();
        closeModal();
        if(U.chat===id){U.chat=null;$('#chat').hidden=true;$('#chat').classList.remove('blur');$('#msg').value='';U.tab=1}
        render();cardAlert(f.name+'님의 방에서 나갔습니다.');
        res();
      }
      finish();
    });
  }

  function slotGet(i){try{var r=localStorage.getItem(KEY+'-slot'+i);return r?JSON.parse(r):null}catch(e){return null}}
  function slotSave(i){
    var d=new Date();

    catch(e){toast('저장할 수 없습니다.');return}
    saveView();
  }
  function slotLoad(i){

    return '<div class="dlg prof info pcard" id="cardI" style="transform:translateX(125%)"><button class="x" data-act="close" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M4 4L20 20M20 4L4 20" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>'+
      '<div class="pav"><span class="fgauge"><svg viewBox="0 0 1000 390" style="color:#cecece"><use href="#i-fish"/></svg>'+((S.fav&&S.fav[id])?'<svg viewBox="0 0 1000 390" style="color:#75c1b4;clip-path:inset(73% 0 0 0)"><use href="#i-fish"/></svg>':'')+'</span></div>'+
      '<div class="pname" style="visibility:hidden"><span>.</span></div><div class="pinfo"></div><hr>'+
      '<div class="pbtns"><span class="stranger">'+esc((S.fav&&S.fav[id])?FAV[id]:'[처음보는 사람]')+'</span></div></div>';
  }
  function slideCards(to){
    var P=$('#cardP'),I=$('#cardI');if(!P||!I)return;
    if(to==='i'){
      I.style.transition='none';I.style.transform='translateX(125%)';
      void I.offsetWidth;
      I.style.transition='';I.style.transform='translateX(0)';
    }else{
      I.style.transition='';I.style.transform='translateX(-125%)';
    }
    U.ps=to;
  }
  function confirmBlock(id){
    var o=$('#overlay');o.classList.add('dim2');
    o.insertAdjacentHTML('beforeend','<div class="cfm" id="cfm"><b>On The Hook</b><p>이 친구를 차단하시겠습니까?<br>친구 추가 화면에서 다시 추가할 수 있습니다.</p><div class="yn"><button data-act="blockyes" data-id="'+id+'">YES</button><button data-act="blockno">NO</button></div></div>');
  }
  function photoSelect(){
    modal('<div class="dlg psel"><h3>프로필 사진 선택</h3><div class="popts"><button data-act="photodef" aria-label="기본 사진"><div class="avatar" style="--s:54px"><img src="'+DEFAULT_PHOTO+'" alt=""></div><span>기본</span></button><button data-act="pickphoto" aria-label="사진 고르기"><span class="gal"><svg viewBox="0 0 24 24" width="30" height="30"><rect x="2" y="4" width="20" height="16" rx="3" fill="#8f8f8f"/><circle cx="8" cy="10" r="2" fill="#fff"/><path d="M3 18l6-5l4 3l3-2l5 4z" fill="#fff"/></svg></span><span>자유</span></button></div></div>');
  }
  function readPhoto(file,cb){
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var c=document.createElement('canvas'),s=256;c.width=c.height=s;
      var m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);
      cb(c.toDataURL('image/jpeg',.82));
    };im.src=r.result};
    r.readAsDataURL(file);
  }

  /* ---------- events ---------- */
  var actions={
    tab:function(el){goTab(+el.dataset.i)},
    gear:function(){setMenu(!U.menu)},
    gearclose:function(){setMenu(false)},
    ach:function(){setMenu(false);achievements()},
    close:closeModal,
    prof:function(el){setMenu(false);U.pfc=!!el.closest('#chat');profile(el.dataset.id)},
    chat:function(el){closeModal();openChat(el.dataset.id)},
    back:closeChat,
    choose:function(el){if(U.ask){var a=U.ask;U.ask=null;renderChat();a.res(+el.dataset.i)}},
    photosel:photoSelect,
    photodef:function(){if(S.me.photo===null||S.me.photo===undefined){openViewer('me');return}S.me.photo=null;persist();render();profile('me')},
    view:function(el){openViewer(el.dataset.id)},
    vsave:function(el){
      var id=el.dataset.id;
      if(!(window.claude&&window.claude.use)){toast('저장할 수 없는 환경입니다.');return}
      window.claude.use('downloads').then(function(dl){
        if(!dl){toast('저장할 수 없는 환경입니다.');return}
        return fetch(FULL[id]).then(function(r){return r.blob()}).then(function(b){return dl.save({filename:FULLNAME[id],data:b})}).then(function(){toast('저장되었습니다.')},function(err){if(!err||err.code!=='declined')toast('저장하지 못했습니다.')});
      },function(){toast('저장할 수 없는 환경입니다.')});
    },    add:function(el){
      var id=el.dataset.id;
      if(S.friends.length>=1){toast('즐겨찾기가 가득 찼습니다.');return}
      var r=S.recs.filter(function(x){return x.id===id})[0];if(!r)return;
      S.recs=S.recs.filter(function(x){return x.id!==id});
      S.friends.push({id:r.id,name:r.name,since:today()});
      S.pg[r.id]={s:'start',i:0,j:0};
      S.notes.unshift({id:Date.now(),t:'새 친구 '+r.name+'님이 등록 되었습니다.',read:false});persist();render();toast(r.name+'님을 친구로 추가했습니다.');run(r.id);
    },
    info:function(){slideCards('i')},
    block:function(el){confirmBlock(el.dataset.id)},
    blockyes:function(el){closeModal();blockNow(el.dataset.id)},
    blockno:function(){var c=$('#cfm');if(c)c.remove();$('#overlay').classList.remove('dim2')},
    rename:function(el){renamePrompt(el.dataset.id,el.dataset.k)},
    nameok:function(el){
      var id=el.dataset.id,v=($('#nameIn').value||'').trim();
      if(v||el.dataset.k==='status'){
        if(el.dataset.k==='status')S.me.status=v;
        else if(id==='me')S.me.name=v;
        else{var f=friend(id);if(f)f.name=v}
        persist();render();if(U.chat)renderChat();
      }
      profile(id);
    },
    namecancel:function(el){profile(el.dataset.id)},
    'tg-ilco':function(){S.ilco=!S.ilco;persist();render();setMenu(true);toast(S.ilco?'일코 모드가 켜졌습니다.':'일코 모드가 꺼졌습니다.')},
    'tg-notif':function(){S.notif=!S.notif;persist();setMenu(true);toast(S.notif?'메시지 알림을 켰습니다.':'메시지 알림을 껐습니다.')},
    album:function(){setMenu(false);albumView()},
    aclose:closeAlbum,
    noop:function(){},
    slotsave:function(el){confirmSlot('save',+el.dataset.i)},
    slotload:function(el){if(slotGet(+el.dataset.i))confirmSlot('load',+el.dataset.i)},
    slotyes:function(el){var i=+el.dataset.i,k=el.dataset.k;var c=$('#cfm');if(c)c.remove();$('#overlay').classList.remove('dim2');if(k==='save')slotSave(i);else slotLoad(i)},
    save:function(){persist();saveView()},
    theme:function(){S.theme=(S.theme+1)%3;S.st.theme=true;persist();render();setMenu(true);if(U.chat)renderChat();toast(['기본모드','서래핑크','야간모드'][S.theme]+' 테마가 적용됩니다.')},
    exit:function(){
      setMenu(false);
      modal('<div class="dlg quit"><h3>게임을 종료하시겠습니까?</h3><p>게임을 완전히 종료할 시,<br>친구로부터 알림을 받을 수 없습니다</p><div class="qb"><button class="q-ok" data-act="quitok">종료</button><button class="q-no" data-act="close">취소</button></div></div>');
    },
    quitok:function(){resetAll()},
    restart:function(){$('#bye').hidden=true;U.tab=0;if(U.chat)closeChat();else render()},
    pickphoto:function(){$('#pick').click()},
    usephoto:function(el){S.me.photo=S.album[+el.dataset.i];S.st.photo=true;persist();render();albumView()}
  };

  $('#app').addEventListener('click',function(e){
    var el=e.target.closest('[data-act]');
    if(!el){
      var t=e.target;
      if(t.id==='viewer'||(t.parentNode&&t.parentNode.id==='viewer'&&t.tagName==='IMG')){closeViewer();return}
      if(t.id==='overlay'||(t.classList&&t.classList.contains('pstack'))){
        if($('#cfm'))return;
        if(U.ps==='i'&&$('#cardI'))slideCards('p');else closeModal();
      }
      return;
    }
    var fn=actions[el.dataset.act];if(fn)fn(el);
  });
  document.addEventListener('keydown',function(e){
    if(e.isComposing)return;
    if(e.key==='Enter'){
      if(e.target.id==='nameIn'){e.preventDefault();var b=document.querySelector('[data-act="nameok"]');if(b)b.click()}
    }else if(e.key==='Escape'){
      if(!$('#viewer').hidden)closeViewer();
      else if(!$('#apage').hidden)closeAlbum();
      else if(!$('#overlay').hidden){var c=document.querySelector('[data-act="namecancel"]');if(c)c.click();else closeModal()}
      else if(U.menu)setMenu(false);
    }
  });
  $('#pick').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
    readPhoto(f,function(src){
      S.me.photo=src;S.st.photo=true;
      if(S.album.indexOf(src)<0&&S.album.length<8)S.album.push(src);
      persist();render();profile('me');
      toast('프로필 사진을 바꿨습니다.');
    });
  });

  /* fit the phone frame to bigger screens (tablet / desktop): scale up, keep margins */
  function fit(){
    var a=document.querySelector('.app');if(!a)return;
    if(window.innerWidth<=500){a.style.zoom='';a.style.height='';a.style.maxHeight='';return}
    var z=Math.max(1,Math.min(1.6,window.innerWidth/470,(window.innerHeight-24)/860));
    a.style.zoom=z;a.style.maxHeight='none';a.style.height=Math.min((window.innerHeight-24)/z,1400)+'px';
  }
  window.addEventListener('resize',fit);fit();
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
  render();
  S.friends.forEach(function(f){run(f.id)});
})();
</script>

</html>
